<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Circle Merge Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script>
        window.onerror = function (msg, url, line, col, error) {
            const div = document.createElement('div');
            div.style.position = 'fixed';
            div.style.top = '0';
            div.style.left = '0';
            div.style.width = '100%';
            div.style.background = 'red';
            div.style.color = 'white';
            div.style.padding = '10px';
            div.style.zIndex = '9999';
            div.textContent = 'Error: ' + msg + ' at ' + line + ':' + col;
            document.body.appendChild(div);
            return false;
        };
        // // Check for Matter
        // window.addEventListener('load', () => {
        //     if (!window.Matter) {
        //         const div = document.createElement('div');
        //         div.style.color = 'red';
        //         div.textContent = 'Matter.js fail to load!';
        //         document.body.appendChild(div);
        //     }
        // });
    </script>
</head>

<body>
    <div id="game-container">
        <div id="ui-layer">
            <div id="score-board">Score: <span id="score">0</span></div>
            <div id="next-circle-container">
                <span>Next:</span>
                <div id="next-circle-preview"></div>
            </div>
        </div>
        <!-- 스코어 바 분리 -->
        <div id="score-bar-container">
            <div id="score-bar-fill"></div>
            <div id="score-bar-text">0 / 500</div>
        </div>
        <canvas id="game-canvas"></canvas>
        <div id="evolution-legend">
            <!-- Populated by JS -->
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>

</html>
