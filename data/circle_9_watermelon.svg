<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 외곽 진한 초록 껍질 -->
  <circle cx="50" cy="50" r="48" fill="#2D5016" stroke="#1A3D0C" stroke-width="2"/>
  
  <!-- 연두색 중간 껍질 -->
  <circle cx="50" cy="50" r="45" fill="#90EE90"/>
  
  <!-- 흰색 속껍질 -->
  <circle cx="50" cy="50" r="42" fill="#F5FFFA"/>
  
  <!-- 빨간 과육 -->
  <circle cx="50" cy="50" r="38" fill="#FF6B6B"/>
  
  <!-- 더 진한 빨간 중심 -->
  <circle cx="50" cy="50" r="30" fill="#FF4757"/>
  
  <!-- 수박 씨 (검은색, 여러 개) -->
  <g fill="#000">
    <ellipse cx="42" cy="38" rx="2.5" ry="4" transform="rotate(20 42 38)"/>
    <ellipse cx="58" cy="40" rx="2.5" ry="4" transform="rotate(-15 58 40)"/>
    <ellipse cx="48" cy="45" rx="2.5" ry="4" transform="rotate(30 48 45)"/>
    <ellipse cx="54" cy="50" rx="2.5" ry="4" transform="rotate(-25 54 50)"/>
    <ellipse cx="45" cy="52" rx="2.5" ry="4" transform="rotate(10 45 52)"/>
    <ellipse cx="60" cy="55" rx="2.5" ry="4" transform="rotate(35 60 55)"/>
    <ellipse cx="40" cy="58" rx="2.5" ry="4" transform="rotate(-20 40 58)"/>
    <ellipse cx="52" cy="60" rx="2.5" ry="4" transform="rotate(15 52 60)"/>
    <ellipse cx="38" cy="48" rx="2.5" ry="4" transform="rotate(25 38 48)"/>
    <ellipse cx="62" cy="48" rx="2.5" ry="4" transform="rotate(-30 62 48)"/>
    <ellipse cx="50" cy="35" rx="2.5" ry="4" transform="rotate(5 50 35)"/>
    <ellipse cx="46" cy="63" rx="2.5" ry="4" transform="rotate(-10 46 63)"/>
  </g>
  
  <!-- 섬유질 하이라이트 (미세한 줄무늬) -->
  <g stroke="#FF8787" stroke-width="0.3" opacity="0.3">
    <line x1="35" y1="35" x2="40" y2="40"/>
    <line x1="65" y1="35" x2="60" y2="40"/>
    <line x1="35" y1="65" x2="40" y2="60"/>
    <line x1="65" y1="65" x2="60" y2="60"/>
  </g>
  
  <!-- 하이라이트 -->
  <ellipse cx="32" cy="28" rx="14" ry="9" fill="white" opacity="0.35"/>
</svg>
