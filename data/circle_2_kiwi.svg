<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 외곽 갈색 껍질 -->
  <circle cx="50" cy="50" r="48" fill="#8B6F47" stroke="#6B5437" stroke-width="2"/>
  
  <!-- 녹색 과육 -->
  <circle cx="50" cy="50" r="42" fill="#A8D08D"/>
  
  <!-- 연한 중심부 -->
  <circle cx="50" cy="50" r="15" fill="#F2F2D0"/>
  
  <!-- 방사형 씨앗 패턴 -->
  <g>
    <!-- 12시 방향부터 시계방향으로 씨앗 배치 -->
    <ellipse cx="50" cy="35" rx="1" ry="1.5" fill="#2C3E50"/>
    <ellipse cx="56" cy="37" rx="1" ry="1.5" fill="#2C3E50" transform="rotate(30 50 50)"/>
    <ellipse cx="60" cy="43" rx="1" ry="1.5" fill="#2C3E50" transform="rotate(60 50 50)"/>
    <ellipse cx="62" cy="50" rx="1" ry="1.5" fill="#2C3E50"/>
    <ellipse cx="60" cy="57" rx="1" ry="1.5" fill="#2C3E50" transform="rotate(120 50 50)"/>
    <ellipse cx="56" cy="63" rx="1" ry="1.5" fill="#2C3E50" transform="rotate(150 50 50)"/>
    <ellipse cx="50" cy="65" rx="1" ry="1.5" fill="#2C3E50"/>
    <ellipse cx="44" cy="63" rx="1" ry="1.5" fill="#2C3E50" transform="rotate(210 50 50)"/>
    <ellipse cx="40" cy="57" rx="1" ry="1.5" fill="#2C3E50" transform="rotate(240 50 50)"/>
    <ellipse cx="38" cy="50" rx="1" ry="1.5" fill="#2C3E50"/>
    <ellipse cx="40" cy="43" rx="1" ry="1.5" fill="#2C3E50" transform="rotate(300 50 50)"/>
    <ellipse cx="44" cy="37" rx="1" ry="1.5" fill="#2C3E50" transform="rotate(330 50 50)"/>
  </g>
  
  <!-- 중심에서 퍼지는 선들 -->
  <g stroke="#D4E7C5" stroke-width="0.5" opacity="0.6">
    <line x1="50" y1="35" x2="50" y2="50"/>
    <line x1="62" y1="50" x2="50" y2="50"/>
    <line x1="50" y1="65" x2="50" y2="50"/>
    <line x1="38" y1="50" x2="50" y2="50"/>
    <line x1="56" y1="37" x2="50" y2="50"/>
    <line x1="60" y1="57" x2="50" y2="50"/>
    <line x1="44" y1="63" x2="50" y2="50"/>
    <line x1="40" y1="43" x2="50" y2="50"/>
  </g>
  
  <!-- 하이라이트 -->
  <ellipse cx="35" cy="35" rx="12" ry="8" fill="white" opacity="0.3"/>
</svg>
