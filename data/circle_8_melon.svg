<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 외곽 연두색 껍질 -->
  <circle cx="50" cy="50" r="48" fill="#90EE90" stroke="#7CCD7C" stroke-width="2"/>
  
  <!-- 연한 녹색 과육 -->
  <circle cx="50" cy="50" r="42" fill="#C1FFC1"/>
  
  <!-- 흰색에 가까운 내부 -->
  <circle cx="50" cy="50" r="30" fill="#F0FFF0"/>
  
  <!-- 중심 씨방 (타원형 공간) -->
  <ellipse cx="50" cy="50" rx="15" ry="18" fill="#FFFACD"/>
  
  <!-- 씨앗들 (작고 흰색) -->
  <g fill="#F5F5DC">
    <ellipse cx="46" cy="45" rx="2" ry="3" fill="#FFFACD" stroke="#DEB887" stroke-width="0.5"/>
    <ellipse cx="54" cy="46" rx="2" ry="3" fill="#FFFACD" stroke="#DEB887" stroke-width="0.5"/>
    <ellipse cx="50" cy="50" rx="2" ry="3" fill="#FFFACD" stroke="#DEB887" stroke-width="0.5"/>
    <ellipse cx="47" cy="54" rx="2" ry="3" fill="#FFFACD" stroke="#DEB887" stroke-width="0.5"/>
    <ellipse cx="53" cy="53" rx="2" ry="3" fill="#FFFACD" stroke="#DEB887" stroke-width="0.5"/>
    <ellipse cx="50" cy="58" rx="2" ry="3" fill="#FFFACD" stroke="#DEB887" stroke-width="0.5"/>
  </g>
  
  <!-- 섬유질 패턴 (세로 선) -->
  <g stroke="#B4EEB4" stroke-width="0.8" opacity="0.5" fill="none">
    <path d="M 30 50 Q 32 45 35 40"/>
    <path d="M 30 50 Q 32 55 35 60"/>
    <path d="M 70 50 Q 68 45 65 40"/>
    <path d="M 70 50 Q 68 55 65 60"/>
    <path d="M 50 30 Q 45 32 40 35"/>
    <path d="M 50 30 Q 55 32 60 35"/>
    <path d="M 50 70 Q 45 68 40 65"/>
    <path d="M 50 70 Q 55 68 60 65"/>
  </g>
  
  <!-- 망사 무늬 (멜론 특징) -->
  <g stroke="#9ACD32" stroke-width="0.3" opacity="0.3">
    <circle cx="50" cy="50" r="38"/>
    <circle cx="50" cy="50" r="34"/>
    <circle cx="50" cy="50" r="30"/>
  </g>
  
  <!-- 하이라이트 -->
  <ellipse cx="32" cy="30" rx="16" ry="11" fill="white" opacity="0.4"/>
</svg>
