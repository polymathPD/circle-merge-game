<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 토마토 몸통 (약간 납작한 원) -->
  <ellipse cx="50" cy="55" rx="38" ry="35" fill="#E74C3C" stroke="#C0392B" stroke-width="1.5"/>
  
  <!-- 밝은 부분 -->
  <ellipse cx="50" cy="55" rx="34" ry="31" fill="#EC7063" opacity="0.6"/>
  
  <!-- 꼭지 (별 모양) -->
  <g>
    <!-- 5개 잎 -->
    <path d="M 50 15 L 48 25 L 38 22 L 45 30 L 35 35 L 45 37 L 42 48 L 50 40 L 58 48 L 55 37 L 65 35 L 55 30 L 62 22 L 52 25 Z" 
          fill="#27AE60" 
          stroke="#1E8449" 
          stroke-width="1"/>
    
    <!-- 잎맥 디테일 -->
    <g stroke="#1E8449" stroke-width="0.5" opacity="0.6" fill="none">
      <line x1="50" y1="22" x2="50" y2="28"/>
      <line x1="44" y1="26" x2="46" y2="30"/>
      <line x1="56" y1="26" x2="54" y2="30"/>
      <line x1="40" y1="33" x2="44" y2="34"/>
      <line x1="60" y1="33" x2="56" y2="34"/>
    </g>
  </g>
  
  <!-- 토마토 하이라이트 -->
  <ellipse cx="38" cy="42" rx="15" ry="12" fill="white" opacity="0.4"/>
  
  <!-- 미세한 광택 -->
  <ellipse cx="42" cy="45" rx="8" ry="6" fill="white" opacity="0.3"/>
  
  <!-- 하단 배꼽 자국 -->
  <g opacity="0.3">
    <circle cx="50" cy="85" r="3" fill="#C0392B"/>
    <circle cx="50" cy="85" r="2" fill="#A93226"/>
  </g>
  
  <!-- 입체감을 위한 그림자 -->
  <ellipse cx="50" cy="72" rx="30" ry="8" fill="#000" opacity="0.08"/>
</svg>
