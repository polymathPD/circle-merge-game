    <line x1="72" y1="38" x2="74" y2="37"/>
    
    <line x1="28" y1="62" x2="26" y2="63"/>
    <line x1="72" y1="62" x2="74" y2="63"/>
    
    <line x1="40" y1="78" x2="39" y2="80"/>
    <line x1="48" y1="80" x2="48" y2="82"/>
    <line x1="52" y1="80" x2="52" y2="82"/>
