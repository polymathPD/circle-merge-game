    <!-- 아래쪽 -->
    <line x1="35" y1="82" x2="33" y2="85"/>
    <line x1="42" y1="85" x2="41" y2="88"/>
    <line x1="50" y1="87" x2="50" y2="90"/>
    <line x1="58" y1="85" x2="59" y2="88"/>
    <line x1="65" y1="82" x2="67" y2="85"/>
    
    <!-- 중앙 털들 -->
