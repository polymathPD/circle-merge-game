  <ellipse cx="50" cy="50" rx="30" ry="36" fill="#9B7F57" opacity="0.6"/>
  
  <!-- 털 질감 (짧은 선들) -->
  <g stroke="#5D4A37" stroke-width="1" opacity="0.7" stroke-linecap="round">
    <!-- 위쪽 -->
    <line x1="35" y1="18" x2="33" y2="15"/>
    <line x1="42" y1="15" x2="41" y2="12"/>
