  <!-- 추가 털 질감 (더 짧고 많음) -->
  <g stroke="#7A6447" stroke-width="0.8" opacity="0.5" stroke-linecap="round">
    <line x1="40" y1="22" x2="39" y2="20"/>
    <line x1="48" y1="20" x2="48" y2="18"/>
    <line x1="52" y1="20" x2="52" y2="18"/>
