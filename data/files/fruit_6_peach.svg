<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 복숭아 몸통 (하트 모양, 위가 움푹) -->
  <path d="M 50 88 
           Q 30 75, 22 55
           Q 18 40, 22 30
           Q 28 22, 38 22
           Q 44 25, 47 30
           Q 48 22, 50 18
           Q 52 22, 53 30
           Q 56 25, 62 22
           Q 72 22, 78 30
           Q 82 40, 78 55
           Q 70 75, 50 88 Z" 
        fill="#FFB6C1" 
        stroke="#FF8FA3" 
        stroke-width="1.5"/>
  
  <!-- 밝은 부분 (노란기 도는) -->
  <path d="M 50 85 
           Q 32 73, 25 55
           Q 22 42, 25 32
           Q 30 25, 38 25
           Q 43 27, 46 32
           Q 47 25, 50 22
           Q 53 25, 54 32
           Q 57 27, 62 25
           Q 70 25, 75 32
           Q 78 42, 75 55
           Q 68 73, 50 85 Z" 
        fill="#FFDAB9" 
        opacity="0.6"/>
  
  <!-- 중앙 세로 홈 (복숭아 특징) -->
  <path d="M 50 18 Q 49 40 48 65 Q 48 75 50 88" 
        stroke="#FF8FA3" 
        stroke-width="2" 
        fill="none" 
        opacity="0.5"/>
  
  <!-- 홈 그림자 -->
  <path d="M 50 20 Q 51 40 52 65 Q 52 75 50 88" 
        stroke="#FFD1DC" 
        stroke-width="1" 
        fill="none" 
        opacity="0.6"/>
  
  <!-- 잎 (위쪽) -->
  <g>
    <!-- 왼쪽 잎 -->
    <ellipse cx="40" cy="20" rx="8" ry="12" fill="#27AE60" stroke="#1E8449" stroke-width="1" transform="rotate(-30 40 20)"/>
    <line x1="40" y1="14" x2="40" y2="24" stroke="#1E8449" stroke-width="0.5"/>
    
    <!-- 오른쪽 잎 -->
    <ellipse cx="60" cy="20" rx="8" ry="12" fill="#27AE60" stroke="#1E8449" stroke-width="1" transform="rotate(30 60 20)"/>
    <line x1="60" y1="14" x2="60" y2="24" stroke="#1E8449" stroke-width="0.5"/>
    
    <!-- 작은 줄기 -->
    <rect x="48" y="14" width="4" height="8" rx="1" fill="#8B7355"/>
  </g>
  
  <!-- 솜털 효과 (미세한 텍스처) -->
  <g opacity="0.15">
    <!-- 좌측 상단 -->
    <circle cx="32" cy="32" r="0.4" fill="#FFF"/>
    <circle cx="36" cy="30" r="0.3" fill="#FFF"/>
    <circle cx="35" cy="35" r="0.4" fill="#FFF"/>
    
    <!-- 우측 상단 -->
    <circle cx="68" cy="32" r="0.4" fill="#FFF"/>
    <circle cx="64" cy="30" r="0.3" fill="#FFF"/>
    <circle cx="65" cy="35" r="0.4" fill="#FFF"/>
    
    <!-- 좌측 중간 -->
    <circle cx="28" cy="45" r="0.4" fill="#FFF"/>
    <circle cx="32" cy="48" r="0.3" fill="#FFF"/>
    <circle cx="30" cy="52" r="0.4" fill="#FFF"/>
    
    <!-- 우측 중간 -->
    <circle cx="72" cy="45" r="0.4" fill="#FFF"/>
    <circle cx="68" cy="48" r="0.3" fill="#FFF"/>
    <circle cx="70" cy="52" r="0.4" fill="#FFF"/>
    
    <!-- 하단 -->
    <circle cx="38" cy="70" r="0.4" fill="#FFF"/>
    <circle cx="45" cy="72" r="0.3" fill="#FFF"/>
    <circle cx="55" cy="72" r="0.3" fill="#FFF"/>
    <circle cx="62" cy="70" r="0.4" fill="#FFF"/>
  </g>
  
  <!-- 붉은 기운 (익은 부분) -->
  <ellipse cx="60" cy="50" rx="18" ry="22" fill="#FF6B9D" opacity="0.25"/>
  
  <!-- 하이라이트 -->
  <ellipse cx="38" cy="35" rx="13" ry="10" fill="white" opacity="0.5"/>
  
  <!-- 미세한 광택 -->
  <ellipse cx="42" cy="38" rx="7" ry="5" fill="white" opacity="0.35"/>
</svg>
