<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 사과 몸통 (위가 움푹 들어간 둥근 모양) -->
  <path d="M 50 85 
           Q 30 82, 20 65
           Q 12 50, 15 35
           Q 20 22, 32 18
           Q 40 16, 45 20
           Q 47 16, 50 15
           Q 53 16, 55 20
           Q 60 16, 68 18
           Q 80 22, 85 35
           Q 88 50, 80 65
           Q 70 82, 50 85 Z" 
        fill="#DC143C" 
        stroke="#B22222" 
        stroke-width="1.5"/>
  
  <!-- 밝은 부분 -->
  <path d="M 50 82 
           Q 32 79, 23 63
           Q 16 50, 18 36
           Q 23 25, 33 21
           Q 40 19, 45 22
           Q 47 19, 50 18
           Q 53 19, 55 22
           Q 60 19, 67 21
           Q 77 25, 82 36
           Q 84 50, 77 63
           Q 68 79, 50 82 Z" 
        fill="#E74C3C" 
        opacity="0.6"/>
  
  <!-- 줄기 -->
  <g>
    <rect x="48" y="8" width="4" height="12" rx="1" fill="#8B7355" stroke="#6B5437" stroke-width="0.8"/>
  </g>
  
  <!-- 잎 (오른쪽으로 비스듬히) -->
  <ellipse cx="58" cy="15" rx="10" ry="6" fill="#27AE60" stroke="#1E8449" stroke-width="1" transform="rotate(20 58 15)"/>
  
  <!-- 잎맥 -->
  <line x1="52" y1="15" x2="62" y2="15" stroke="#1E8449" stroke-width="0.5" opacity="0.6" transform="rotate(20 58 15)"/>
  
  <!-- 하이라이트 (광택) -->
  <ellipse cx="35" cy="32" rx="16" ry="13" fill="white" opacity="0.45"/>
  
  <!-- 미세한 광택 -->
  <ellipse cx="38" cy="36" rx="10" ry="8" fill="white" opacity="0.3"/>
  
  <!-- 하단 배꼽 자국 -->
  <g opacity="0.25">
    <circle cx="50" cy="80" r="4" fill="#8B0000"/>
    <circle cx="50" cy="80" r="2.5" fill="#A52A2A"/>
  </g>
  
  <!-- 미세한 반점들 (자연스러운 질감) -->
  <g fill="#8B0000" opacity="0.15">
    <circle cx="42" cy="45" r="0.8"/>
    <circle cx="58" cy="48" r="0.7"/>
    <circle cx="38" cy="55" r="0.6"/>
    <circle cx="62" cy="58" r="0.8"/>
    <circle cx="45" cy="65" r="0.7"/>
    <circle cx="55" cy="67" r="0.6"/>
  </g>
  
  <!-- 붉은 그라데이션 효과 -->
  <ellipse cx="65" cy="50" rx="20" ry="25" fill="#8B0000" opacity="0.15"/>
</svg>
