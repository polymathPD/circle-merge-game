<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 광채 효과 -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFEB3B;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#FFC107;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="seedGradient" cx="40%" cy="35%">
      <stop offset="0%" style="stop-color:#FFF59D;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FFA000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6F00;stop-opacity:1" />
    </radialGradient>
    
    <!-- 반짝임 애니메이션 -->
    <animateTransform
      id="sparkleAnim"
      attributeName="transform"
      type="rotate"
      from="0 50 50"
      to="360 50 50"
      dur="3s"
      repeatCount="indefinite"/>
  </defs>
  
  <!-- 외부 광채 -->
  <circle cx="50" cy="50" r="48" fill="url(#glow)" opacity="0.7"/>
  
  <!-- 황금 씨앗 본체 (타원형) -->
  <ellipse cx="50" cy="50" rx="32" ry="38" 
           fill="url(#seedGradient)" 
           stroke="#F57F17" 
           stroke-width="2"/>
  
  <!-- 씨앗 중앙 라인 (세로) -->
  <path d="M 50 15 Q 48 50 50 85" 
        stroke="#F57F17" 
        stroke-width="2.5" 
        fill="none" 
        opacity="0.8"/>
  
  <!-- 씨앗 질감 (미세한 곡선들) -->
  <g opacity="0.4">
    <path d="M 30 35 Q 35 40 30 45" stroke="#E65100" stroke-width="1" fill="none"/>
    <path d="M 70 35 Q 65 40 70 45" stroke="#E65100" stroke-width="1" fill="none"/>
    <path d="M 28 50 Q 33 52 28 54" stroke="#E65100" stroke-width="0.8" fill="none"/>
    <path d="M 72 50 Q 67 52 72 54" stroke="#E65100" stroke-width="0.8" fill="none"/>
    <path d="M 32 65 Q 36 68 32 71" stroke="#E65100" stroke-width="1" fill="none"/>
    <path d="M 68 65 Q 64 68 68 71" stroke="#E65100" stroke-width="1" fill="none"/>
  </g>
  
  <!-- 입체감을 위한 하이라이트 -->
  <ellipse cx="38" cy="32" rx="16" ry="20" 
           fill="white" 
           opacity="0.5"/>
  
  <!-- 강한 하이라이트 -->
  <ellipse cx="40" cy="35" rx="9" ry="12" 
           fill="white" 
           opacity="0.7"/>
  
  <!-- 상단 끝 하이라이트 -->
  <ellipse cx="50" cy="20" rx="6" ry="4" 
           fill="#FFFDE7" 
           opacity="0.8"/>
  
  <!-- 하단 끝 강조 -->
  <ellipse cx="50" cy="80" rx="8" ry="5" 
           fill="#E65100" 
           opacity="0.3"/>
  
  <!-- 반짝임 효과 (별 모양들) -->
  <g opacity="0.9">
    <!-- 큰 별 (왼쪽 상단) -->
    <g transform="translate(22, 22)">
      <path d="M 0,-8 L 2,-2 L 8,0 L 2,2 L 0,8 L -2,2 L -8,0 L -2,-2 Z" 
            fill="#FFF9C4" 
            opacity="0.9">
        <animateTransform
          attributeName="transform"
          type="scale"
          values="0.8;1.2;0.8"
          dur="2s"
          repeatCount="indefinite"/>
        <animate
          attributeName="opacity"
          values="0.5;1;0.5"
          dur="2s"
          repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- 작은 별 (오른쪽 상단) -->
    <g transform="translate(75, 28)">
      <path d="M 0,-5 L 1.5,-1.5 L 5,0 L 1.5,1.5 L 0,5 L -1.5,1.5 L -5,0 L -1.5,-1.5 Z" 
            fill="#FFF59D" 
            opacity="0.8">
        <animateTransform
          attributeName="transform"
          type="scale"
          values="1;1.3;1"
          dur="1.5s"
          begin="0.3s"
          repeatCount="indefinite"/>
        <animate
          attributeName="opacity"
          values="0.4;0.9;0.4"
          dur="1.5s"
          begin="0.3s"
          repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- 작은 별 (왼쪽 중간) -->
    <g transform="translate(18, 55)">
      <path d="M 0,-4 L 1,-1 L 4,0 L 1,1 L 0,4 L -1,1 L -4,0 L -1,-1 Z" 
            fill="#FFEB3B" 
            opacity="0.7">
        <animateTransform
          attributeName="transform"
          type="scale"
          values="0.9;1.4;0.9"
          dur="2.5s"
          begin="0.6s"
          repeatCount="indefinite"/>
        <animate
          attributeName="opacity"
          values="0.3;0.8;0.3"
          dur="2.5s"
          begin="0.6s"
          repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- 작은 별 (오른쪽 하단) -->
    <g transform="translate(78, 72)">
      <path d="M 0,-5 L 1.5,-1.5 L 5,0 L 1.5,1.5 L 0,5 L -1.5,1.5 L -5,0 L -1.5,-1.5 Z" 
            fill="#FFF176" 
            opacity="0.75">
        <animateTransform
          attributeName="transform"
          type="scale"
          values="1.1;1.4;1.1"
          dur="1.8s"
          begin="0.9s"
          repeatCount="indefinite"/>
        <animate
          attributeName="opacity"
          values="0.4;0.9;0.4"
          dur="1.8s"
          begin="0.9s"
          repeatCount="indefinite"/>
      </path>
    </g>
  </g>
  
  <!-- 테두리 강조 -->
  <ellipse cx="50" cy="50" rx="32" ry="38" 
           fill="none" 
           stroke="#FFD54F" 
           stroke-width="1" 
           opacity="0.6"/>
</svg>
