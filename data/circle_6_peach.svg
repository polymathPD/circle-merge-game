<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 외곽 복숭아색 껍질 -->
  <circle cx="50" cy="50" r="48" fill="#FFB6C1" stroke="#FF8FA3" stroke-width="2"/>
  
  <!-- 연한 과육 -->
  <circle cx="50" cy="50" r="42" fill="#FFDAB9"/>
  
  <!-- 더 연한 내부 -->
  <circle cx="50" cy="50" r="32" fill="#FFF0D8"/>
  
  <!-- 중심 씨 (복숭아 씨는 크고 울퉁불퉁함) -->
  <ellipse cx="50" cy="50" rx="14" ry="16" fill="#8B4513"/>
  
  <!-- 씨의 질감 -->
  <g stroke="#654321" stroke-width="0.8" fill="none">
    <path d="M 40 45 Q 45 43 50 45"/>
    <path d="M 50 45 Q 55 43 60 45"/>
    <path d="M 40 50 Q 45 48 50 50"/>
    <path d="M 50 50 Q 55 48 60 50"/>
    <path d="M 40 55 Q 45 53 50 55"/>
    <path d="M 50 55 Q 55 53 60 55"/>
  </g>
  
  <!-- 씨 주변 적갈색 -->
  <ellipse cx="50" cy="50" rx="20" ry="22" fill="#CD853F" opacity="0.3"/>
  
  <!-- 방사형 섬유질 패턴 -->
  <g stroke="#FFE4B5" stroke-width="0.5" opacity="0.4">
    <line x1="50" y1="34" x2="50" y2="18"/>
    <line x1="50" y1="66" x2="50" y2="82"/>
    <line x1="34" y1="50" x2="18" y2="50"/>
    <line x1="66" y1="50" x2="82" y2="50"/>
    <line x1="38" y1="38" x2="26" y2="26"/>
    <line x1="62" y1="62" x2="74" y2="74"/>
    <line x1="62" y1="38" x2="74" y2="26"/>
    <line x1="38" y1="62" x2="26" y2="74"/>
  </g>
  
  <!-- 하이라이트 -->
  <ellipse cx="33" cy="30" rx="15" ry="10" fill="white" opacity="0.5"/>
</svg>
